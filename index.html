<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Match</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="main-menu">
        <div class="button-container">
            <button id="btn-start" class="menu-btn">BẮT ĐẦU</button>
            <button id="btn-huongDan" class="menu-btn">NHẤN ĐỂ XEM HƯỚNG DẪN</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <canvas id="canvas"></canvas>
        <div class="header">
            <button id="btn-back" class="control-btn">Menu</button>
            <div class="box">Điểm: <span id="score">0</span></div>
            <div class="box">Thời gian: <span id="timer">180</span>s</div>
            <button id="btn-shuffle" class="control-btn">Đổi bài</button>
        </div>
        <div id="board"></div>
    </div>

    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
